<!DOCTYPE html>
<html lang="en">
<head>
    <title>Play Hangman</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-dark bg-dark px-4">
    <span class="navbar-brand text-white">NAME</span>
    <a href="dashboard.html" class="btn btn-light">Dashboard</a>
</nav>

<div class="container text-center mt-5">

    <h1 id="word">_ _ _ _ _</h1>

    <img src="hangman0.png" alt="hangman" width="200">

    <div class="mt-4">

        <div id="letters">

            <button class="btn btn-outline-dark m-1">A</button>
