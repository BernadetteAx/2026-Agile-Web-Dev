<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hangman Game</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <span class="navbar-brand">Hangman</span>
        <div>
            <button class="btn btn-outline-light btn-sm">Leaderboard</button>
            <button class="btn btn-outline-light btn-sm">Profile</button>
        </div>
    </div>
</nav>

<!-- Main Content -->
<div class="container text-center mt-5">

    <h1 class="mb-4">Hangman Game</h1>

    <!-- Word -->
    <p class="fs-3">_ _ _ _</p>

    <!-- Hangman Placeholder -->
    <p>[Hangman Drawing]</p>

    <!-- Letters -->
    <div class="mt-4 d-flex flex-wrap justify-content-center gap-2">
        <button class="btn btn-outline-dark">A</button>
        <button class="btn btn-outline-dark">B</button>
        <button class="btn btn-outline-dark">C</button>
        <button class="btn btn-outline-dark">D</button>
        <button class="btn btn-outline-dark">E</button>
        <button class="btn btn-outline-dark">F</button>
        <button class="btn btn-outline-dark">G</button>
        <button class="btn btn-outline-dark">H</button>
        <button class="btn btn-outline-dark">I</button>
        <button class="btn btn-outline-dark">J</button>
        <button class="btn btn-outline-dark">K</button>
        <button class="btn btn-outline-dark">L</button>
        <button class="btn btn-outline-dark">M</button>
        <button class="btn btn-outline-dark">N</button>
        <button class="btn btn-outline-dark">O</button>
        <button class="btn btn-outline-dark">P</button>
        <button class="btn btn-outline-dark">Q</button>
        <button class="btn btn-outline-dark">R</button>
        <button class="btn btn-outline-dark">S</button>
        <button class="btn btn-outline-dark">T</button>
        <button class="btn btn-outline-dark">U</button>
        <button class="btn btn-outline-dark">V</button>
        <button class="btn btn-outline-dark">W</button>
        <button class="btn btn-outline-dark">X</button>
        <button class="btn btn-outline-dark">Y</button>
        <button class="btn btn-outline-dark">Z</button>
    </div>

    <!-- Game Info -->
    <div class="mt-4">
        <p><strong>Wrong guesses:</strong> 0 / 6</p>
        <p><strong>Score:</strong> 0</p>
    </div>

    <!-- Button -->
    <div class="mt-4">
        <button class="btn btn-primary">Start New Game</button>
    </div>

</div>

</body>
</html>
