    <div class="container mt-4">
      <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-6 col-lg-4">
          <div class="panel">
            <!-- search bar -->
            <div class="panel-section">
              <input
                type="text"
                id="searchInput"
                class="input"
                placeholder="SEARCH FRIENDS..."
              />
            </div>

            <!-- sorting buttons -->
            <div class="panel-section d-flex justify-content-center gap-2">
              <button class="btn-arcade sort-btn" data-sort="name">A-Z</button>
              <button class="btn-arcade sort-btn" data-sort="wins">WINS</button>
            </div>

            <div id="friendsList" class="list"></div>

            <div id="noResults" class="no-results">NO PLAYERS FOUND</div>
          </div>
        </div>
      </div>
    </div>

    <script>
      const searchInput = document.getElementById("searchInput");
      const friendsList = document.getElementById("friendsList");

      // FAKE DATABASE CHANGE
      const allUsers = [
        { name: "PLAYER ONE", wins: 420 },
        { name: "PIXELGIRL", wins: 69 },
        { name: "RETRODUDE", wins: 911 },
        { name: "ALPHAGHOST", wins: 210 },
        { name: "BYTEHUNTER", wins: 67 },
        { name: "CODEMASTER", wins: 12 },
        { name: "HANGMANPRO", wins: 999 },
        { name: "TEST", wins: 0 },
        { name: "TEST1", wins: 3 },
        { name: "TEST2", wins: 7 },
        { name: "TEST3", wins: 1 },
      ];

      // current friends list
      const friends = [];

      function renderFriends() {
        friendsList.innerHTML = "";

        if (friends.length === 0) {
          friendsList.innerHTML = `<div class="no-results">NO FRIENDS ADDED</div>`;
          return;
        }

        friends.forEach((friendData) => {
          const friend = document.createElement("div");
          friend.classList.add("row-item", "friend");

          friend.innerHTML = `
        <span class="friend-name">${friendData.name}</span>
        <span class="friend-score">${friendData.wins} WINS</span>
      `;

          friendsList.appendChild(friend);
        });
      }

      function addFriend(name) {
        // find user object
        const user = allUsers.find((u) => u.name === name);

        if (!user) {
          alert("User not found");
          return;
        }

        // check duplicate
        if (friends.some((f) => f.name === name)) {
          alert("You're already friends with " + name);
          return;
        }

        friends.push(user); // add name + wins
        renderFriends();
      }

      searchInput.addEventListener("keydown", (e) => {
        if (e.key !== "Enter") return;

        const inputName = searchInput.value.trim().toUpperCase();
        if (!inputName) return;

        addFriend(inputName);
        searchInput.value = "";
      });

      renderFriends();
    </script>
