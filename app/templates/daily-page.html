{% extends "base.html" %}

{% block title %}Daily - Hangman{% endblock %}

{% block nav_daily %}active-icon{% endblock %}

{% block extra_css %}
  <link rel="stylesheet" href="/static/css/daily.css" />
{% endblock %}

{% block content %}

    <div class="container text-center">

      <div class="game-timer mx-auto">01:30</div>

      <div id="figure-card">
        <svg
          id="hangman-figure"
          width="180"
          height="240"
          viewBox="0 0 180 220"
          stroke="#ffffff"
          stroke-width="7"
          fill="none"
          shape-rendering="crispEdges"
        >
          <!-- Pole thing -->
          <line x1="20" y1="200" x2="160" y2="200" />
          <line x1="50" y1="200" x2="50" y2="20" />
          <line x1="50" y1="20" x2="120" y2="20" />
          <line x1="120" y1="20" x2="120" y2="55" />

          <!-- Head -->
          <rect x="94" y="55" width="52" height="52" />

          <!-- Body -->
          <line x1="120" y1="107" x2="120" y2="145" />

          <!-- Arms -->
          <line x1="120" y1="115" x2="92" y2="135" />
          <line x1="120" y1="115" x2="148" y2="135" />

          <!-- Legs -->
          <line x1="120" y1="145" x2="102" y2="175" />
          <line x1="120" y1="145" x2="138" y2="175" />
        </svg>
      </div>


      <!-- WORD -->
      <!-- Is it too low contrast? -->
      <div class="word-row"></div>

      <div class="mistake-label">
        Mistakes: <span id="mistakeNum">1</span> / 6
      </div>

    </div>

    <div class="container-fluid px-2">
      <div class="keyboard">

        <div class="keyboard-row row1">
          <div class="key">Q</div>
          <div class="key">W</div>
          <div class="key">E</div>
          <div class="key">R</div>
          <div class="key">T</div>
          <div class="key">Y</div>
          <div class="key">U</div>
          <div class="key">I</div>
          <div class="key">O</div>
          <div class="key">P</div>
        </div>

        <div class="keyboard-row row2">
          <div class="key">A</div>
          <div class="key">S</div>
          <div class="key">D</div>
          <div class="key">F</div>
          <div class="key">G</div>
          <div class="key">H</div>
          <div class="key">J</div>
          <div class="key">K</div>
          <div class="key">L</div>
        </div>

        <div class="keyboard-row row3">
          <div class="key wide" data-key="ENTER">ENTER</div>
          <div class="key">Z</div>
          <div class="key">X</div>
          <div class="key">C</div>
          <div class="key">V</div>
          <div class="key">B</div>
          <div class="key">N</div>
          <div class="key">M</div>
          <div class="key wide" data-key="BACKSPACE">⌫</div>
        </div>

      </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <script src="/static/js/daily-hangman.js"></script>

{% endblock %}
