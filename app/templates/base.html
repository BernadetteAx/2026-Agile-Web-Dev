<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Hangman{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/static/css/base.css" />
    {% block extra_css %}{% endblock %}
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
    <style>
    #logout-overlay {
      display: none !important;
      position: fixed !important;
      inset: 0 !important;
      background: rgba(0, 0, 0, 0.75) !important;
      z-index: 9999 !important;
      align-items: center !important;
      justify-content: center !important;
    }
    #logout-overlay.active {
      display: flex !important;
    }
    #logout-modal {
      background: #161515;
      border: 2px solid #3a3a3a;
      padding: 32px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      max-width: 320px;
      width: 90%;
      font-family: "Press Start 2P", system-ui;
    }
    #logout-modal p {
      color: #ffffff;
      font-size: 11px;
      text-align: center;
      margin: 0;
      line-height: 1.8;
    }
    .logout-buttons {
      display: flex;
      gap: 16px;
    }
    #logout-confirm {
      cursor: pointer;
      font-family: "Press Start 2P", system-ui;
      font-size: 10px;
      padding: 10px 18px;
      border: 2px solid #ff4444 !important;
      color: #ff4444;
    }
    #logout-confirm:hover { background: #ff4444; color: #000; }
    #logout-cancel {
      cursor: pointer;
      font-family: "Press Start 2P", system-ui;
      font-size: 10px;
      padding: 10px 18px;
      border: 2px solid #3a3a3a !important;
      color: #888;
    }
    #logout-cancel:hover { background: #3a3a3a; color: #fff; }
  </style>
  </head>

  <body>
    <header class="container-fluid d-flex justify-content-between align-items-center">
      <h1>HANGMAN</h1>
      <div class="header-right">
        <a href="/daily" class="{% block nav_daily %}{% endblock %}"><img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0AAAACXBIWXMAAAsTAAALEwEAmpwYAAAAX0lEQVR4nO3UQQrAMAgFUe9/6emqy6RYJSbmz1YiDwKaKRWISXcBzDk7C0BwURjCagCDB8sg7AqIQvoA3ryHRwDaAbwJwDGAbMjvPVQDogvSvpJqwOjwfGXZUQ1QbXsApkU155GfCTEAAAAASUVORK5CYII="></a>
        <a href="/unlimited" class="{% block nav_unlimited %}{% endblock %}"><img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0AAAACXBIWXMAAAsTAAALEwEAmpwYAAAAWklEQVR4nO3PMRIAEBBD0dz/0tGoFGaXmDXktch8gFkQk/BMABcHZSGsCmBgQHXnrgAmHhy5Swd0DsDkbPRPwA4H0AHduQfqHVYH7A6oPoDygHEwCmqsDrBnNU6QZbdgwYsdAAAAAElFTkSuQmCC"></a>
        <a href="/leaderboard" class="{% block nav_stats %}{% endblock %}"><img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0AAAACXBIWXMAAAsTAAALEwEAmpwYAAAAcElEQVR4nO3SQQ6AIAxE0bn/pYeVG5OmBRoYCn9pHH0GgVcwdoayACTdVwPA4LUzABz4uWoCMLmRAXjVBXiFAfTE6gAa++4j4MBXSgC+zgUw+cX3AdKOwBwE++/N5zEZYO3DgNm2A6z0AavSA7ywqQaqx1vdhoEO6wAAAABJRU5ErkJggg=="></a>
        <a href="/achievements" class="{% block nav_achievements %}{% endblock %}"><img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0AAAACXBIWXMAAAsTAAALEwEAmpwYAAAAa0lEQVR4nO2RQQrAMAgE/f+np5cUQgltRBNtcK6y66AihQEaEgUl0AhfzG4RSuBoASZYkc0nIM78R+BGdbYVHUQL9GhL3N9ICUQJYCwyi5BZgAdnCTAIfi18m6tFyCLQMx326MASduwoZAcXr/mdf3UGWdUAAAAASUVORK5CYII="></a>
        <a href="/friends" class="{% block nav_friends %}{% endblock %}"><img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0AAAACXBIWXMAAAsTAAALEwEAmpwYAAAAY0lEQVR4nO3TSwoAIAgAUe9/6WkfCGWWKc4yqB59RLpOiSltXEvKAlY7hhAN8Cocwi6AS49reT6/AMS6QHrArfIASCP9HYD1+9KAaIA3xBzRACtkPvrnV4E3YHdhbaP8gK5sA2dTba/1wIM5AAAAAElFTkSuQmCC"></a>

        <!-- Login/logout icon — triggers popup if logged in, goes to /login if not -->
        <a href="/login" id="login-icon-link" class="{% block nav_login %}{% endblock %}">
          <img id="login-icon" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0AAAACXBIWXMAAAsTAAALEwEAmpwYAAAAsUlEQVR4nO2USw6CMBBAG44ACXAuE6+ACz2CGw5o3Jh4GvLc1IiGtnxmQJJ5q6aTtq8z0zpnGP8ISuxPwAlhAkgJAA2QR9bVwFFFALj46duQhD/8CXTAQUOgBB4+dAeKXqwKxcQEQhKpw8WbkE+q3+Xoj/NVXgHfmQjeXFOg2kyALUvAQMPFXoeoAJFuT0lICbSxVP+U5qQhkAHXEV/xecx+kwWWYALMFZBmPwKG4VbkBRrVx5wOhoZTAAAAAElFTkSuQmCC">
        </a>
      </div>
    </header>

    <!-- Logout confirmation modal -->
    <div id="logout-overlay" style="display:none">
      <div id="logout-modal">
        <p>ARE YOU SURE YOU WANT TO LOG OUT?</p>
        <div class="logout-buttons">
          <button id="logout-confirm">LOG OUT</button>
          <button id="logout-cancel">CANCEL</button>
        </div>
      </div>
    </div>

    <main>
      {% block content %}{% endblock %}
    </main>

    <script>
      // Set this server-side or via a data attribute — true if a user session exists
      // e.g. a Jinja2 variable, a data attribute, or a JS global set in your auth script.
      const userIsLoggedIn = true;

      const loginLink  = document.getElementById('login-icon-link');
      const overlay    = document.getElementById('logout-overlay');
      const confirmBtn = document.getElementById('logout-confirm');
      const cancelBtn  = document.getElementById('logout-cancel');

      if (userIsLoggedIn) {
        // Intercept click and show popup instead of navigating
        loginLink.addEventListener('click', function (e) {
          e.preventDefault();
          overlay.classList.add('active');
        });
      }

      confirmBtn.addEventListener('click', function () {
        window.location.href = '/logout'; // your logout route
      });

      cancelBtn.addEventListener('click', function () {
        overlay.classList.remove('active');
      });

      // Close on backdrop click
      overlay.addEventListener('click', function (e) {
        if (e.target === overlay) overlay.classList.remove('active');
      });
    </script>

    {% block extra_js %}{% endblock %}
  </body>
</html>
