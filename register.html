<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hangman Register</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>

    <header>
        <h1>HANGMAN</h1>

        <div class="header-right">
            <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0AAAACXBIWXMAAAsTAAALEwEAmpwYAAAAsUlEQVR4nO2USw6CMBBAG44ACXAuE6+ACz2CGw5o3Jh4GvLc1IiGtnxmQJJ5q6aTtq8z0zpnGP8ISuxPwAlhAkgJAA2QR9bVwFFFALj46duQhD/8CXTAQUOgBB4+dAeKXqwKxcQEQhKpw8WbkE+q3+Xoj/NVXgHfmQjeXFOg2kyALUvAQMPFXoeoAJFuT0lICbSxVP+U5qQhkAHXEV/xecx+kwWWYALMFZBmPwKG4VbkBRrVx5wOhoZTAAAAAElFTkSuQmCC" alt="close">
        </div>
    </header>

    <main class="auth-page">
        <div class="auth-box">
            <h2>REGISTER</h2>

            <input id="registerUsername" type="text" placeholder="USERNAME">
            <input id="registerEmail" type="email" placeholder="EMAIL">
            <input id="registerPassword" type="password" placeholder="PASSWORD">
            <input id="registerConfirmPassword" type="password" placeholder="CONFIRM PASSWORD">

            <p class="password-note">
                Password is case-insensitive, must be at least 8 characters, and include letters and numbers.
            </p>

            <button id="registerBtn">REGISTER</button>

            <p id="registerMessage" class="message"></p>

            <p class="switch-text">
                ALREADY HAVE AN ACCOUNT? <a href="login.html">LOGIN</a>
            </p>
        </div>
    </main>

    <script src="auth.js"></script>
</body>
</html>
