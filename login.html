<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hangman Login</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>

    <header>
        <h1>HANGMAN</h1>

        <div class="header-right">
            <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0AAAACXBIWXMAAAsTAAALEwEAmpwYAAAAsUlEQVR4nO2USw6CMBBAG44ACXAuE6+ACz2CGw5o3Jh4GvLc1IiGtnxmQJJ5q6aTtq8z0zpnGP8ISuxPwAlhAkgJAA2QR9bVwFFFALj46duQhD/8CXTAQUOgBB4+dAeKXqwKxcQEQhKpw8WbkE+q3+Xoj/NVXgHfmQjeXFOg2kyALUvAQMPFXoeoAJFuT0lICbSxVP+U5qQhkAHXEV/xecx+kwWWYALMFZBmPwKG4VbkBRrVx5wOhoZTAAAAAElFTkSuQmCC" alt="close">
        </div>
    </header>

    <main class="auth-page">
        <div class="auth-box">
            <h2>LOGIN</h2>

            <input id="loginEmail" type="email" placeholder="EMAIL">
            <input id="loginPassword" type="password" placeholder="PASSWORD">

            <button id="loginBtn">LOGIN</button>

            <p id="loginMessage" class="message"></p>

            <p class="switch-text">
                NO ACCOUNT? <a href="register.html">REGISTER</a>
            </p>
        </div>
    </main>

    <script src="auth.js"></script>
</body>
</html>
